name: Czech Translation Audit

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - ".translation-audit/**"
      - ".github/workflows/czech-translation-audit.yml"
      - "applications/**"
      - "applications_user/**"
      - "assets/**"
      - "documentation/**"
      - "furi/**"
      - "lib/**"
      - "targets/**"
      - "scripts/**"
      - "firmware/**"
      - "site_scons/**"

permissions:
  contents: read

jobs:
  scan:
    name: "Scan ${{ matrix.area }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        area:
          - applications
          - applications_user
          - assets
          - documentation
          - furi
          - lib
          - targets
          - scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan likely English strings
        run: python .translation-audit/scan_strings.py "${{ matrix.area }}"
      - uses: actions/upload-artifact@v4
        with:
          name: audit-${{ matrix.area }}
          path: report.csv
          if-no-files-found: error
          retention-days: 14

  combine:
    name: Combine audit reports
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: audit-*
          path: audit-parts
          merge-multiple: false
      - name: Combine reports
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          files = sorted(Path("audit-parts").glob("*/report.csv"))
          rows = []
          for file in files:
              with file.open(encoding="utf-8-sig", newline="") as f:
                  rows.extend(list(csv.DictReader(f)))
          rows.sort(key=lambda r: (r["file"], int(r["line"]), r["candidate_string"]))
          with open("english-string-audit.csv", "w", encoding="utf-8-sig", newline="") as f:
              w = csv.DictWriter(f, fieldnames=["file", "line", "candidate_string", "source_line"])
              w.writeheader()
              w.writerows(rows)
          print(f"Combined {len(rows)} candidate strings from {len(files)} parallel scan reports.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: complete-english-string-audit
          path: english-string-audit.csv
          retention-days: 30
